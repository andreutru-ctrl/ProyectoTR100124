<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>TripApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header th:insert="fragments/menu :: menu-principal"></header>

<section class="bg-light py-5">
    <div class="container">
        <h1 class="display-6 fw-semibold">Encuentra los mejores Trips en El Salvador.</h1>
        <p class="text-muted mb-4">Puedes buscar por descripción y categoría.</p>

        <form class="row g-2 align-items-center">
            <div class="col-12 col-md-6">
                <input class="form-control" type="search" placeholder="Escribe una búsqueda" aria-label="Search">
            </div>

            <div class="col-12 col-md-4">
                <select class="form-select">
                    <option selected>Todas las categorías</option>
                    <option>Aventura</option>
                    <option>Gastronomía</option>
                    <option>Playa</option>
                </select>
            </div>

            <div class="col-12 col-md-2 d-grid">
                <button class="btn btn-primary" type="submit">Buscar</button>
            </div>
        </form>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <h2 class="text-center fw-bold mb-4">TRIPS DESTACADOS</h2>

        <div class="row align-items-start g-4 mb-4" th:each="trip : ${trips}">
            <div class="col-12 col-md-4 col-lg-3">
                <img class="img-fluid rounded"
                     th:src="@{/images/{img}(img=${trip.imagen})}"
                     alt="Trip">
            </div>

            <div class="col-12 col-md-8 col-lg-9">
                <h3 class="h4 fw-semibold mb-2" th:text="${trip.nombre}">Nombre Trip</h3>

                <div class="mb-2">
                    <div class="fw-semibold">Categoría: <span class="fw-normal">Aventura</span></div>
                    <div class="fw-semibold">
                        Publicado:
                        <span class="fw-normal" th:text="${trip.fecha}"></span>
                    </div>
                </div>

                <p class="text-muted mb-3" th:text="${trip.descripcion}"></p>

                <a class="btn btn-secondary"
                   th:href="@{/trips/view/{id}(id=${trip.id})}">
                    Ver detalles »
                </a>
            </div>
        </div>
    </div>
</section>

<footer th:insert="fragments/footer :: pie-pagina"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
