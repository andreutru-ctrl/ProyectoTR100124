<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Categorías</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header th:insert="fragments/menu :: menu-principal"></header>

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h2>Listado de Categorías</h2>
        </div>

        <div class="card-body">

            <div th:if="${msg != null}"
                 class="alert alert-success"
                 th:text="${msg}"
                 role="alert">
            </div>

            <a th:href="@{/categorias/create}"
               class="btn btn-primary mb-3">
                <i class="fa-solid fa-file"></i> Nueva
            </a>

            <table class="table table-hover">

                <thead class="table-secondary">
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Operaciones</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="categoria : ${categorias}">

                    <td th:text="${categoria.id}"></td>

                    <td th:text="${categoria.nombre}"></td>

                    <td th:text="${categoria.descripcion}"></td>

                    <td>

                        <a th:href="@{/categorias/edit/{id}(id=${categoria.id})}"
                           class="btn btn-success btn-sm">
                            <i class="fa-solid fa-pen"></i>
                        </a>

                        <a th:href="@{/categorias/delete(id=${categoria.id})}"
                           class="btn btn-success btn-sm"
                           onclick="return confirm('¿Está seguro de eliminar esta categoría?')">
                            <i class="fa-solid fa-trash"></i>
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<footer th:insert="fragments/footer :: pie-pagina"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
