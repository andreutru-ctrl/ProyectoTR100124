<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Trips</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header th:insert="fragments/menu :: menu-principal"></header>

<div class="container mt-4">

  <div class="card">
    <div class="card-header">
      <h2>Listado de Trips en El Salvador</h2>
    </div>

    <div class="card-body">

      <div th:if="${msg != null}" class="alert alert-success" th:text="${msg}" role="alert"></div>

      <a th:href="@{/trips/create}" class="btn btn-primary mb-3">
        <i class="fa-solid fa-file"></i> Nuevo
      </a>

      <table class="table table-hover">

        <thead class="table-secondary">
        <tr>
          <th>Categoría</th>
          <th>Nombre</th>
          <th>Fecha Publicación</th>
          <th>Estatus</th>
          <th>Destacada</th>
          <th>Editar/Borrar</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="trip : ${trips}">
          <td th:text="${trip.categoria != null ? trip.categoria.nombre : 'Sin categoría'}"></td>
          <td th:text="${trip.nombre}"></td>
          <td th:text="${#dates.format(trip.fecha, 'yyyy-MM-dd HH:mm:ss')}"></td>
          <td th:text="${trip.estatus}"></td>
          <td th:text="${trip.destacado == 1 ? 'SI' : 'NO'}"></td>
          <td>
            <a th:href="@{/trips/edit/{id}(id=${trip.id})}"
               class="btn btn-success btn-sm">
              <i class="fa-solid fa-pen"></i>
            </a>

            <a th:href="@{/trips/delete(id=${trip.id})}"
               class="btn btn-success btn-sm"
               onclick="return confirm('¿Está seguro de eliminar este trip?')">
              <i class="fa-solid fa-trash"></i>
            </a>
          </td>
        </tr>
        </tbody>

      </table>

    </div>
  </div>

</div>

<footer th:insert="fragments/footer :: pie-pagina"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
