<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Form Trip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header th:insert="fragments/menu :: menu-principal"></header>

<section class="py-4">
  <div class="container">
    <hr>

    <div class="card">
      <h4 class="card-header"><strong>Datos del Trip</strong></h4>
      <div class="card-body">
        <form th:action="@{/trips/save}" method="post" th:object="${trip}">

          <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
            Por favor corrija los siguientes errores:
            <ul>
              <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
            </ul>
          </div>

          <div class="row">
            <div class="col-md-3 mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" name="nombre" placeholder="Titulo del trip">
            </div>

            <div class="col-md-9 mb-3">
              <label class="form-label">Descripción</label>
              <input type="text" class="form-control" name="descripcion" placeholder="Breve descripcion del trip">
            </div>

            <div class="col-md-3 mb-3">
              <label class="form-label">Categoría</label>
              <select class="form-select">
                <option>En la montaña</option>
                <option>Playa</option>
                <option>Aventura</option>
              </select>
            </div>

            <div class="col-md-3 mb-3">
              <label class="form-label">Estatus</label>
              <select class="form-select" name="estatus">
                <option value="Creada">Creada</option>
                <option value="Publicada">Publicada</option>
                <option value="Cancelada">Cancelada</option>
              </select>
            </div>

            <div class="col-md-3 mb-3">
              <label class="form-label">Fecha de Publicación</label>
              <input type="text" class="form-control" name="fecha" placeholder="dd-MM-yyyy">
            </div>

            <div class="col-md-3 mb-3 d-flex align-items-center">
              <div class="mt-4">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="destacado" value="1" checked>
                  <label class="form-check-label">Destacado</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="destacado" value="0">
                  <label class="form-check-label">No Destacado</label>
                </div>
              </div>
            </div>

            <div class="col-md-3 mb-3">
              <label class="form-label">Costo del Trip</label>
              <input type="text" class="form-control" name="costo" placeholder="Costo del trip.">
            </div>

            <div class="col-md-9 mb-3">
              <label class="form-label">Imagen</label>
              <input type="file" class="form-control">
            </div>

            <div class="col-md-9 mb-3">
              <label class="form-label">Detalles</label>
              <textarea class="form-control" name="detalles" id="detalles" rows="4"></textarea>
            </div>

            <div class="col-md-3 mb-3">
              <label class="form-label">Imagen/Logo</label>
              <div class="border p-2 text-center">
                Generic placeholder image
              </div>
            </div>
          </div>

          <hr>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer th:insert="fragments/footer :: pie-pagina"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/tinymce/tinymce.min.js}"></script>
<script>
  tinymce.init({
    selector: '#detalles',
    plugins: "textcolor, table lists code",
    toolbar: "undo redo | bold italic | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | forecolor backcolor table code"
  });
</script>
</body>
</html>
