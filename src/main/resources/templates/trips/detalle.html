<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>TripApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header th:insert="fragments/menu :: menu-principal"></header>

<section class="py-4">
    <div class="container">
        <hr>

        <div class="row">
            <div class="col-md-5">
                <img class="rounded img-fluid"
                     th:src="@{/images/{img}(img=${trip.imagen})}"
                     alt="Generic placeholder image">
            </div>

            <div class="col-md-7">
                <div class="card">
                    <div class="card-body">
                        <h2 class="mb-4">
                            Trip: <strong th:text="${trip.nombre}"></strong>
                        </h2>

                        <h4>
                            <strong>Categoría:</strong> <span>Nombre la categoría</span>
                        </h4>

                        <h5>
                            <strong>Publicado:</strong> <span th:text="${trip.fecha}"></span>
                        </h5>

                        <h5>
                            <strong>Costo:</strong> <span th:text="${trip.costo}"></span>
                        </h5>

                        <p class="mt-4" th:text="${trip.descripcion}"></p>

                        <div class="card mt-4 mb-3">
                            <div class="card-header">
                                Detalles del Trip
                            </div>
                            <div class="card-body">
                                <p class="mb-0" th:text="${trip.descripcion}"></p>
                            </div>
                        </div>

                        <a class="btn btn-primary" href="#">Comprar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:insert="fragments/footer :: pie-pagina"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
