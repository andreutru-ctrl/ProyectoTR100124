<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trips</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<img th:src="@{/images/logo.png}" width="136" height="136" alt="Logo">
<h1>Trips en El Salvador</h1>

<table class="table table-hover">
    <tr>
        <td>Imagen</td>
        <td>id</td>
        <td>nombre</td>
        <td>Fecha publicacion</td>
        <td>Costo</td>
        <td>Descripcion</td>
        <td>Destacado</td>
        <td>Calificacion</td>
        <td>Detalle</td>
        <td>Eliminar</td>
    </tr>

    <tr th:each="trip : ${trips}">
        <td>
            <img th:src="@{/images/{img}(img=${trip.imagen})}" style="height:40px;" alt="img">
        </td>

        <td th:text="${trip.id}"></td>
        <td th:text="${trip.nombre}"></td>
        <td th:text="${#dates.format(trip.fecha, 'dd-MM-yyyy')}"></td>
        <td th:text="${trip.costo}"></td>
        <td th:text="${trip.descripcion}"></td>

        <td>
            <span th:if="${trip.destacado == 1}" class="badge bg-success">si</span>
            <span th:unless="${trip.destacado == 1}" class="badge bg-danger">No</span>
        </td>

        <td>
            <span th:if="${trip.calificacion >= 6}" class="badge bg-success" th:text="${trip.calificacion}"></span>
            <span th:unless="${trip.calificacion >= 6}" class="badge bg-danger" th:text="${trip.calificacion}"></span>
        </td>

        <td>
            <a class="btn btn-success btn-sm"
               th:href="@{/trips/view/{id}(id=${trip.id})}">
                Detalle
            </a>
        </td>

        <td>
            <a class="btn btn-danger btn-sm"
               th:href="@{/trips/delete(id=${trip.id})}">
                Eliminar
            </a>
        </td>
    </tr>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
